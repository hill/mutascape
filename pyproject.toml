[project]
name = "mutascape"
version = "0.1.0"
description = "DMS- and structure-grounded synthetic combinatorial protein fitness landscapes for MLDE/ALDE benchmarking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "biopython>=1.83",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "torch>=2.0",
    "fair-esm>=2.0",
    "pyarrow>=14.0",
    "plotly>=5.18",
    "scikit-learn>=1.3",
    "ipykernel>=7.2.0",
    "nbformat>=5.10.4",
    "nbconvert>=7.17.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = []
